<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TieSheet icon: a C64-blue screen holding a small sheet: heading row and column, a yellow cursor cell,
       rows of numbers and a green total.  Colours are the Colodore C64 palette. -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#706DEB"/>
  <rect x="52" y="52" width="408" height="408" rx="70" fill="#2E2C9B"/>
  <rect x="112" y="112" width="296" height="296" rx="14" fill="#fff"/>
  <!-- heading row and column -->
  <rect x="112" y="112" width="296" height="52" rx="14" fill="#B2B2B2"/>
  <rect x="112" y="150" width="52" height="258" fill="#B2B2B2"/>
  <rect x="112" y="150" width="52" height="14" fill="#B2B2B2"/>
  <!-- the cell under the cursor -->
  <rect x="226" y="226" width="90" height="62" fill="#EDF171"/>
  <!-- grid lines -->
  <g stroke="#706DEB" stroke-width="5">
    <path d="M112 164 H408 M112 226 H408 M112 288 H408 M112 350 H408"/>
    <path d="M164 112 V408 M226 112 V408 M316 112 V408"/>
  </g>
  <!-- column letters as bars, numbers right-aligned, a green total -->
  <g fill="#2E2C9B">
    <rect x="236" y="130" width="50" height="16" rx="8"/>
    <rect x="334" y="130" width="52" height="16" rx="8"/>
    <rect x="178" y="130" width="34" height="16" rx="8"/>
    <rect x="248" y="248" width="56" height="16" rx="8"/>
    <rect x="178" y="180" width="34" height="16" rx="8"/>
    <rect x="178" y="244" width="34" height="16" rx="8"/>
    <rect x="256" y="182" width="48" height="16" rx="8"/>
    <rect x="334" y="182" width="52" height="16" rx="8"/>
    <rect x="342" y="244" width="44" height="16" rx="8"/>
    <rect x="262" y="306" width="42" height="16" rx="8"/>
    <rect x="334" y="306" width="52" height="16" rx="8"/>
  </g>
  <g fill="#56AC4D">
    <rect x="334" y="368" width="52" height="18" rx="9"/>
    <rect x="248" y="368" width="56" height="18" rx="9"/>
  </g>
</svg>
